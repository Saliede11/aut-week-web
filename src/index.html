<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برنامه هفتگی</title>
<style>
@font-face { font-family: 'Vazirmatn'; src: url('fonts/Vazirmatn-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'Vazirmatn'; src: url('fonts/Vazirmatn-Medium.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: 'Vazirmatn'; src: url('fonts/Vazirmatn-SemiBold.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: 'Vazirmatn'; src: url('fonts/Vazirmatn-Bold.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }

/* Layout: phone app shell. Header, scrolling content, bottom tab bar. Week grid, day agenda with free-time gaps, settings. iOS and Android differ in header, tab bar and add button. */
:root {
  --bg: #f2f5f7;
  --surface: #ffffff;
  --ink: #14202a;
  --muted: #5b6b78;
  --line: #d6dfe6;
  --line-soft: #e8eff4;
  --accent: #0e6877;
  --accent-ink: #ffffff;
  --today: #e4f1f3;
  --danger: #b3261e;
  --ok: #1f7a46;
  --food: #a64b08;  --food-bg: #fbe7d4;
  --pool: #0a62a6;  --pool-bg: #d8ecfa;
  --gym: #5f35a8;   --gym-bg: #e9e1f8;
  --me: #276b43;    --me-bg: #dcf0e3;
  --bar: rgba(255, 255, 255, .86);
  --font: 'Vazirmatn', system-ui, 'Noto Sans Arabic', Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d161c; --surface: #16222a; --ink: #e5edf2; --muted: #95a6b3; --line: #2a3a44; --line-soft: #223039;
    --accent: #52b6c6; --accent-ink: #0a1a1f; --today: #173039; --danger: #ff8a80; --ok: #7fcb9b;
    --food: #f2a86f; --food-bg: #3b2817; --pool: #7bbcf0; --pool-bg: #12304a;
    --gym: #bba0f2; --gym-bg: #2a2045; --me: #7fcb9b; --me-bg: #17362a; --bar: rgba(22, 34, 42, .86);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d161c; --surface: #16222a; --ink: #e5edf2; --muted: #95a6b3; --line: #2a3a44; --line-soft: #223039;
  --accent: #52b6c6; --accent-ink: #0a1a1f; --today: #173039; --danger: #ff8a80; --ok: #7fcb9b;
  --food: #f2a86f; --food-bg: #3b2817; --pool: #7bbcf0; --pool-bg: #12304a;
  --gym: #bba0f2; --gym-bg: #2a2045; --me: #7fcb9b; --me-bg: #17362a; --bar: rgba(22, 34, 42, .86);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.7; }
.app { height: 100%; height: 100dvh; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; position: relative; background: var(--bg); }
.app > * { min-width: 0; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: calc(12px + env(safe-area-inset-top, 0px)) 8px; }
.head h1 { margin: 0; font-size: 22px; line-height: 1.3; font-weight: 700; text-wrap: balance; }
.head small { display: block; color: var(--muted); font-size: 12.5px; }
.iconbtn { font: inherit; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn.spin svg { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(-360deg); } }
[data-platform="android"] .head { background: var(--surface); padding-block: 12px; border-bottom: 1px solid var(--line-soft); }
[data-platform="android"] .head h1 { font-size: 20px; }
[data-platform="ios"] .head h1 { font-size: 28px; letter-spacing: -.2px; }

.main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-block: 8px 24px; display: flex; flex-direction: column; gap: 12px; }
.main > * { flex: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
[data-platform="ios"] .card { border-radius: 14px; border-color: transparent; }

/* sync strip */
.sync { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 12.5px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.off { background: var(--danger); }
.sync b { color: var(--ink); font-weight: 600; }
.badge { margin-inline-start: auto; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--line-soft); color: var(--muted); white-space: nowrap; }

/* filters */
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { font: inherit; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; flex: none; }
.chip i { width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
.chip b { font-weight: 600; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="false"] { opacity: .5; }
.chip[aria-pressed="false"] i { background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
.t-food { --c: var(--food); --cb: var(--food-bg); }
.t-pool { --c: var(--pool); --cb: var(--pool-bg); }
.t-gym  { --c: var(--gym);  --cb: var(--gym-bg); }
.t-me   { --c: var(--me);   --cb: var(--me-bg); }

/* week grid */
.week { --axis: 34px; --hh: 40px; overflow: hidden; }
.row { display: grid; grid-template-columns: var(--axis) repeat(7, minmax(0, 1fr)); }
.dayhead { appearance: none; font: inherit; color: var(--ink); background: none; border: 0; border-bottom: 1px solid var(--line); padding: 6px 0 5px; text-align: center; display: flex; flex-direction: column; align-items: center; line-height: 1.3; cursor: pointer; min-width: 0; }
.dayhead span { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.dayhead strong { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 24px; border-radius: 999px; }
.dayhead.today span { color: var(--accent); font-weight: 600; }
.dayhead.today strong { background: var(--accent); color: var(--accent-ink); }
.axis { position: relative; }
.axis small { position: absolute; inset-inline-end: 4px; transform: translateY(-50%); font-size: 9.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.col { position: relative; border-inline-start: 1px solid var(--line-soft);
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--hh) - 1px), var(--line-soft) calc(var(--hh) - 1px), var(--line-soft) var(--hh)); }
.col.today { background-color: var(--today); }
.now { position: absolute; inset-inline: 0; height: 2px; background: var(--danger); z-index: 3; pointer-events: none; }
.blk { appearance: none; font: inherit; position: absolute; margin: 0; padding: 2px 3px; border: 0; border-radius: 5px; background: var(--cb); color: var(--c); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 45%, transparent); overflow: hidden; z-index: 2; cursor: pointer; text-align: start; font-size: 10px; line-height: 1.3; font-weight: 600; }
.blk span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blk:focus-visible { outline: 2px solid var(--ink); z-index: 4; }

/* day view */
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.strip button { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 5px 0; display: flex; flex-direction: column; align-items: center; line-height: 1.3; cursor: pointer; min-width: 0; }
.strip span { font-size: 11px; color: var(--muted); white-space: nowrap; }
.strip strong { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.strip button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.strip button[aria-pressed="true"] span { color: inherit; opacity: .85; }
.strip button.today:not([aria-pressed="true"]) strong { color: var(--accent); }
.agenda { display: flex; flex-direction: column; gap: 8px; }
.item { appearance: none; font: inherit; text-align: start; width: 100%; display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: start; padding: 10px 12px; border: 0; border-radius: 12px; background: var(--cb); color: var(--c); cursor: pointer; }
.item .t { font-size: 12.5px; font-variant-numeric: tabular-nums; line-height: 1.5; }
.item .t em { display: block; font-style: normal; opacity: .8; }
.item .n { font-weight: 600; font-size: 15px; line-height: 1.5; }
.item .n small { display: block; font-weight: 400; font-size: 12.5px; opacity: .9; }
.gap { appearance: none; font: inherit; width: 100%; text-align: start; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; border: 1.5px dashed var(--line); border-radius: 12px; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; }
.gap b { color: var(--accent); font-weight: 600; white-space: nowrap; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

/* settings */
.sec { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.sec h2 { margin: 0; font-size: 15px; font-weight: 600; }
.sec p { margin: 0; color: var(--muted); font-size: 12.5px; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.kv span:first-child { color: var(--muted); }
.meals { display: grid; grid-template-columns: 3.6em 1fr 1fr; gap: 8px; align-items: end; }
.meals > strong { font-weight: 500; padding-bottom: 7px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.list li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 8px; background: var(--me-bg); color: var(--me); font-size: 13px; }
.list li span { min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.list button { font: inherit; font-size: 12px; border: 0; background: transparent; color: inherit; cursor: pointer; text-decoration: underline; padding: 4px; }

/* forms */
label { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--muted); min-width: 0; }
input, select { font: inherit; font-size: 15px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; width: 100%; min-width: 0; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn { font: inherit; font-weight: 600; font-size: 15px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; width: 100%; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--line); font-weight: 500; }
.msg { min-height: 1.4em; font-size: 12.5px; color: var(--muted); }
.msg.err { color: var(--danger); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fields .full { grid-column: 1 / -1; }

/* bottom bar */
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bar); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-top: 6px; padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); }
.tabs button { font: inherit; font-size: 11.5px; border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 2px 0; cursor: pointer; }
.tabs svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }
[data-platform="android"] .tabs { background: var(--surface); }
[data-platform="android"] .tabs button[aria-current="page"] svg { background: color-mix(in srgb, var(--accent) 18%, transparent); border-radius: 14px; width: 56px; padding: 2px 16px; box-sizing: border-box; }
.fab { position: absolute; inset-inline-start: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(66px + env(safe-area-inset-bottom, 0px)); width: 54px; height: 54px; border-radius: 16px; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.25); z-index: 5; }
.fab svg { width: 26px; height: 26px; }

/* sheet + onboarding */
.scrim { position: absolute; inset: 0; background: rgba(8, 14, 18, .5); z-index: 20; display: flex; align-items: flex-end; }
.sheet { width: 100%; max-height: 90%; overflow-y: auto; background: var(--surface); color: var(--ink); border-radius: 18px 18px 0 0; padding: 14px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.sheet h2 { margin: 0; font-size: 17px; font-weight: 600; }
.grab { width: 38px; height: 4px; border-radius: 2px; background: var(--line); align-self: center; }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; font-variant-numeric: tabular-nums; }
.onb { position: absolute; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; justify-content: center; gap: 18px; padding-block: 24px; }
.onb h1 { margin: 0; font-size: 26px; line-height: 1.4; text-wrap: balance; }
.onb p { margin: 0; color: var(--muted); max-width: 46ch; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.steps li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; font-size: 13.5px; }
.steps li i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; background: var(--today); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .iconbtn.spin svg { animation: none; } }

[hidden] { display: none !important; }
body { font-feature-settings: "kern", "liga"; -webkit-text-size-adjust: 100%; }
.hact { display: flex; gap: 8px; }
.sync .chip { margin-inline-start: auto; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 3px; border-radius: 10px; background: var(--line-soft); }
.seg3 { grid-template-columns: 1fr 1fr 1fr; }
.seg button { font: inherit; font-size: 13px; border: 0; border-radius: 8px; padding: 6px 0; background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.pl { flex-direction: row; align-items: center; gap: 10px; color: var(--ink); font-size: 14px; padding: 5px 0; }
.pl input { width: 20px; height: 20px; flex: none; }
.pl small { color: var(--muted); }
.plist { display: flex; flex-direction: column; }
.used { opacity: .55; }
.btn:disabled { opacity: .6; cursor: default; }
details { font-size: 13px; } details summary { cursor: pointer; padding: 6px 0; color: var(--accent); font-weight: 600; } details ol { margin: 6px 0 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 6px; }
textarea.log { width: 100%; direction: ltr; text-align: left; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; line-height: 1.5; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 8px; resize: vertical; }
</style>
</head>
<body>
<div class="app" id="app" dir="rtl" lang="fa" data-platform="android">
  <header class="head gut">
    <div>
      <h1 id="title">برنامه هفتگی</h1>
      <small id="weekLabel"></small>
    </div>
    <div class="hact"><button class="iconbtn" id="themeBtn" type="button" aria-label="تغییر تم"></button><button class="iconbtn" id="refresh" type="button" aria-label="به‌روزرسانی از سایت">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button></div>
  </header>

  <main class="main gut" id="main"></main>

  <button class="fab" id="fab" type="button" aria-label="افزودن به برنامه شخصی">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabs" id="tabs" aria-label="بخش‌ها">
    <button type="button" data-tab="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>هفته</button>
    <button type="button" data-tab="day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg>روز</button>
    <button type="button" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>تنظیمات</button>
  </nav>
</div>

<script>
/*PURE*/
const DAYS = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه'];
const DAYS_SHORT = ['ش', 'ی', 'د', 'س', 'چ', 'پ', 'ج'];
const faDigits = s => String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const toMin = t => { const p = String(t).split(':').map(Number); return p[0] * 60 + p[1]; };
const fmt = m => faDigits(String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'));
function mealBase(name) {
  if (name.includes('صبحانه')) return 'صبحانه';
  if (name.includes('ناهار')) return 'ناهار';
  if (name.includes('شام')) return 'شام';
  if (name.includes('افطار')) return 'افطاری';
  if (name.includes('سحر')) return 'سحری';
  return null;
}
function layoutLanes(list) {
  const items = list.map((e, i) => ({ e, i })).sort((x, y) => x.e.start - y.e.start || y.e.end - x.e.end);
  const out = new Array(list.length);
  let cluster = [], clusterEnd = -1, laneEnds = [];
  const flush = () => {
    const n = Math.max(...cluster.map(c => c.lane)) + 1;
    cluster.forEach(c => { out[c.i] = { lane: c.lane, lanes: n }; });
    cluster = [];
  };
  for (const it of items) {
    if (cluster.length && it.e.start >= clusterEnd) { flush(); laneEnds = []; clusterEnd = -1; }
    let lane = laneEnds.findIndex(end => end <= it.e.start);
    if (lane < 0) { lane = laneEnds.length; laneEnds.push(0); }
    laneEnds[lane] = it.e.end;
    cluster.push({ i: it.i, lane });
    clusterEnd = Math.max(clusterEnd, it.e.end);
  }
  if (cluster.length) flush();
  return out;
}
function freeGaps(list, from, to, minLen) {
  const sorted = list.slice().sort((a, b) => a.start - b.start);
  const gaps = []; let cur = from;
  for (const e of sorted) {
    if (e.start - cur >= minLen) gaps.push({ start: cur, end: Math.min(e.start, to) });
    cur = Math.max(cur, e.end);
  }
  if (to - cur >= minLen) gaps.push({ start: cur, end: to });
  return gaps;
}
const durText = m => { const h = Math.floor(m / 60), r = m % 60; return (h ? faDigits(h) + ' ساعت' : '') + (h && r ? ' و ' : '') + (r ? faDigits(r) + ' دقیقه' : ''); };
const enDigits = s => String(s).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
function parseLabel(raw) {
  const s = enDigits(raw).replace(/\s+/g, ' ').trim();
  const t = s.match(/\d{1,2}:\d{2}/g);
  if (t && t.length >= 2) { const a = toMin(t[0]), b = toMin(t[1]); return { kind: 'session', start: Math.min(a, b), end: Math.max(a, b) }; }
  return { kind: 'meal', meal: s };
}
const STATUS_BY_COLOR = { blue: 'رزرو شده', orange: 'مصرف شده', green: 'مصرف نشده' };
function statusOf(cls, tip) {
  const m = /background-([a-z]+)/i.exec(cls || '');
  const color = m ? m[1].toLowerCase() : '';
  return { color, status: STATUS_BY_COLOR[color] || tip || 'رزرو' };
}
function convertItem(it) {

    '<ol class="steps"><li><i>۱</i><span>صفحه ورود دانشگاه داخل اپ باز می‌شود. خودتان وارد شوید. رمز شما برای اپ دیده نمی‌شود.</span></li><li><i>۲</i><span>بعد از رسیدن به سایت رزرو غذا، دکمه «ورود انجام شد» پایین صفحه را بزنید.</span></li><li><i>۳</i><span>اپ فقط می‌خواند و هیچ تغییری در حساب شما نمی‌دهد. داده‌ها فقط روی همین گوشی می‌مانند.</span></li></ol>' +
    '<button class="btn" id="onbGo" type="button">ورود به سایت دانشگاه</button><p id="onbNote" class="msg" aria-live="polite"></p>';
  if (WEB) {
    const p = el.querySelector('p'); if (p) p.textContent = 'این برنامه رزروهای غذا، استخر و باشگاه شما را از سایت دانشگاه می‌خواند و در یک برنامه هفتگی نشان می‌دهد.';
    const ol = el.querySelector('.steps'); if (ol) ol.innerHTML = '<li><i>۱</i><span>یک‌بار یک میان‌بر (بوکمارک) در مرورگر می‌سازید.</span></li><li><i>۲</i><span>سایت رزرو را باز می‌کنید، وارد می‌شوید و میان‌بر را می‌زنید.</span></li><li><i>۳</i><span>برنامه فقط می‌خواند و هیچ تغییری در حساب شما نمی‌دهد. داده‌ها فقط در همین مرورگر می‌مانند.</span></li>';
    const b = el.querySelector('#onbGo'); if (b) b.textContent = 'شروع اتصال';
  }
  $('app').appendChild(el);
}
function setOnbNote(t) { const o = $('onbNote'); if (o) { o.textContent = t || ''; o.className = 'msg' + (t ? ' err' : ''); } }

function activePlaces() { return PLACES.filter(p => state.places.includes(p.id)).map(p => ({ id: p.id, type: p.type, name: p.name, group: p.group, rest: p.rest })); }
function login() {
  if (WEB) { openWebGuide(); return; }
  if (!NATIVE) { note = 'ورود فقط داخل اپ اندروید ممکن است.'; setOnbNote(note); render(); return; }
  setOnbNote('');
  Native.openLogin(HOME_URL);
}

function openWebGuide() {
  const code = (Native.bridgeCode && Native.bridgeCode()) || '';
  const link = code ? '<a href="' + esc(code) + '" onclick="return false" class="wglink">برنامه هفتگی</a>' : '';
  openSheet('<h2>اتصال به سایت رزرو</h2>' +
    '<ol class="steps"><li><i>۱</i><span>یک‌بار «میان‌بر» را بسازید (پایین همین برگه).</span></li>' +
    '<li><i>۲</i><span>سایت رزرو را در همین مرورگر باز کنید و با پنل دانشجویی وارد شوید تا صفحه رزرو را ببینید.</span></li>' +
    '<li><i>۳</i><span>میان‌بر را بزنید. برنامه در یک تب جدید باز می‌شود و رزروها را می‌خواند. اطلاعات فقط به همین مرورگر می‌رسد و چیزی از رزروهای شما تغییر نمی‌کند.</span></li></ol>' +
    '<button class="btn" id="wgOpen" type="button">باز کردن سایت رزرو</button>' +
    '<details><summary>ساخت میان‌بر در Safari آیفون</summary><ol>' +
    '<li>دکمه «کپی کد میان‌بر» را بزنید.</li>' +
    '<li>در Safari دکمه Share را بزنید، Add Bookmark را انتخاب کنید و نام آن را «برنامه هفتگی» بگذارید.</li>' +
    '<li>دکمه Bookmarks (کتاب) را بزنید، Edit را بزنید و روی بوکمارک بزنید.</li>' +
    '<li>آدرس را پاک کنید، کد کپی‌شده را بچسبانید و Done را بزنید.</li>' +
    '<li>هر بار: سایت رزرو را باز کنید، Bookmarks را بزنید و «برنامه هفتگی» را انتخاب کنید.</li></ol></details>' +
    '<details><summary>روی کامپیوتر</summary><p>این دکمه را بکشید و در نوار بوکمارک بگذارید: ' + link + '</p></details>' +
    '<button class="btn ghost" id="wgCopy" type="button"' + (code ? '' : ' disabled') + '>کپی کد میان‌بر</button>' +
    '<textarea class="log" id="wgCode" readonly rows="3" aria-label="کد میان‌بر">' + esc(code) + '</textarea>' +
    '<p class="msg" id="wgMsg" aria-live="polite"></p>' +
    '<button class="btn ghost" type="button" data-close="1">بستن</button>');
}
function doAnalyze() {
  if (WEB) { anaNote = 'تحلیل ساختار فقط در اپ اندروید ممکن است.'; render(); return; }
  if (!NATIVE) { anaNote = 'تحلیل فقط داخل اپ اندروید ممکن است.'; render(); return; }
  if (busy || anaBusy) return;
  const pick = t => PLACES.find(p => p.type === t && state.places.includes(p.id)) || PLACES.find(p => p.type === t);
  const list = ['food', 'pool', 'gym'].map(pick).filter(Boolean).map(p => ({ id: p.id, type: p.type, name: p.name, group: p.group, rest: p.rest }));
  anaBusy = true; anaNote = 'در حال اتصال به سایت…';
  render();
  Native.analyze(JSON.stringify(list));
}
function doSync() {
  if (WEB && !(Native.bridgeMode && Native.bridgeMode())) { openWebGuide(); return; }
  if (!NATIVE) { note = 'به‌روزرسانی فقط داخل اپ اندروید ممکن است.'; setOnbNote(note); render(); return; }
  if (busy) return;
  const places = activePlaces();
  if (!places.length) { note = 'حداقل یک مکان را در تنظیمات انتخاب کنید.'; render(); return; }
  busy = true; needLogin = false; note = ''; progress = 'در حال اتصال به سایت…';
  setOnbNote(progress);
  render();
  Native.startSync(JSON.stringify(places));
}
function finishSync(data) {
  busy = false; needLogin = false;
  const imports = [], unknown = new Set();
  (data.places || []).forEach(p => {
    const weeks = { 0: [], 1: [] };
    (p.weeks || []).forEach(w => {
      weeks[w.offset] = (w.items || []).map(convertItem).filter(Boolean);
      weeks[w.offset].forEach(x => { if (x.color && !STATUS_BY_COLOR[x.color]) unknown.add(x.color); });
    });
    imports.push({ id: p.id, type: p.type, name: p.name, weeks });
  });
  const errs = data.errors || [];
  errs.forEach(e => addLog(e));
  unknown.forEach(c => addLog('رنگ ناشناخته در جدول: ' + c));
  state.imports = imports;
  state.lastSync = data.syncedAt || Date.now();
  note = errs.length ? 'بعضی مکان‌ها خوانده نشد' : '';
  const n = imports.reduce((a, p) => a + p.weeks[0].length + p.weeks[1].length, 0);
  addLog('به‌روزرسانی انجام شد: ' + imports.length + ' مکان، ' + n + ' رزرو');
  if (imports.length) state.connected = true;
  else setOnbNote(note || 'چیزی خوانده نشد.');
  save(); render();
}
window.onNative = function (ev) {
  if (!ev) return;
  if (ev.t === 'progress') {
    if (ev.web && !busy) { busy = true; closeSheet(); render(); }
    progress = ev.msg || '';
    const s = $('syncTxt'); if (s) s.textContent = progress;
    const a = $('anaTxt'); if (a && anaBusy) a.textContent = progress;
    setOnbNote(progress); const o = $('onbNote'); if (o) o.className = 'msg';
    return;
  }
  if (ev.t === 'loginDone') { doSync(); return; }
  if (ev.t === 'done') { finishSync(ev.data || {}); return; }
  if (ev.t === 'report') {
    anaBusy = false;
    anaNote = 'گزارش ذخیره شد: ' + ev.name + ' (' + Math.max(1, Math.round((ev.bytes || 0) / 1024)) + ' کیلوبایت) ' + (ev.where || 'در پوشه Download') + '. آن را برای پشتیبان بفرستید.';
    addLog('گزارش تحلیل ذخیره شد: ' + ev.name);
    save(); render(); return;
  }
  if (ev.t === 'error' && anaBusy) {
    anaBusy = false;
    if (ev.code === 'LOGIN') needLogin = true;
    anaNote = 'خطا: ' + (ev.msg || ev.code || '');
    addLog('خطای تحلیل ' + (ev.code || '') + ': ' + (ev.msg || ''));
    save(); render(); return;
  }
  if (ev.t === 'error') {
    busy = false;
    addLog('خطا ' + (ev.code || '') + ': ' + (ev.msg || ''));
    if (ev.code === 'LOGIN') { needLogin = true; note = ''; setOnbNote('ورود تأیید نشد. دوباره وارد شوید و به صفحه رزرو غذا برسید.'); }
    else { note = ev.msg || 'خطا در به‌روزرسانی'; setOnbNote(note); }
    save(); render();
  }
};

document.addEventListener('click', e => {
  const t = e.target, q = sel => t.closest(sel);
  let x;
  if (q('#onbGo')) { login(); return; }
  if (q('#themeBtn')) { state.theme = effectiveDark() ? 'light' : 'dark'; save(); applyTheme(); render(); return; }
  if ((x = q('[data-theme-set]'))) { state.theme = x.dataset.themeSet; save(); applyTheme(); render(); return; }
  if (q('#wgOpen')) { try { window.open(HOME_URL, '_blank'); } catch (e) {} return; }
  if (q('#wgCopy')) {
    const ta = $('wgCode'), done = ok => { const m = $('wgMsg'); if (m) m.textContent = ok ? 'کد کپی شد. حالا آن را در بوکمارک جایگزین کنید.' : 'کپی خودکار نشد. متن را انتخاب و کپی کنید.'; };
    const fallback = () => { try { ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); done(document.execCommand('copy')); } catch (e) { done(false); } };
    try { navigator.clipboard.writeText(ta.value).then(() => done(true), fallback); } catch (e) { fallback(); }
    return;
  }
  if (q('#analyzeBtn')) { doAnalyze(); return; }
  if ((x = q('[data-act]'))) { if (x.dataset.act === 'login') login(); else doSync(); return; }
  if (q('#refresh')) { doSync(); return; }
  if (q('#logout')) {
    if (!logoutArmed) { logoutArmed = setTimeout(() => { logoutArmed = null; render(); }, 3500); render(); return; }
    clearTimeout(logoutArmed); logoutArmed = null;
    if (NATIVE) Native.logout();
    state.connected = false; state.lastSync = 0; state.imports = []; needLogin = false; note = ''; busy = false;
    save(); render(); return;
  }
  if (q('#toggleLog')) { showLog = !showLog; render(); return; }
  if ((x = q('#tabs [data-tab]'))) { tab = x.dataset.tab; render(); $('main').scrollTop = 0; return; }
  if ((x = q('[data-type]'))) { visible[x.dataset.type] = !visible[x.dataset.type]; render(); return; }
  if ((x = q('[data-week]'))) { state.week = Number(x.dataset.week); save(); render(); return; }
  if ((x = q('[data-goday]'))) { selDay = Number(x.dataset.goday); tab = 'day'; render(); return; }
  if ((x = q('[data-pick]'))) { selDay = Number(x.dataset.pick); render(); return; }
  if ((x = q('[data-ev]'))) { const ev = (window.__evIdx || [])[Number(x.dataset.ev)]; if (ev) eventSheet(ev); return; }
  if ((x = q('[data-gap]'))) { const p = x.dataset.gap.split('-').map(Number); addSheet(selDay, p[0], Math.min(p[1], p[0] + 90)); return; }
  if (q('#fab') || q('#addMe')) { addSheet(tab === 'day' ? selDay : todayIdx(), 10 * 60, 11 * 60 + 30); return; }
  if ((x = q('[data-del]'))) { state.personal = state.personal.filter(p => String(p.id) !== x.dataset.del); save(); closeSheet(); render(); return; }
  if (q('[data-close]')) { closeSheet(); return; }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'meForm') return;
  e.preventDefault();
  const title = $('meTitle').value.trim(), s = $('meStart').value, en = $('meEnd').value, msg = $('meMsg');
  msg.className = 'full msg err';
  if (!title) { msg.textContent = 'عنوان را بنویسید.'; return; }
  if (!s || !en || toMin(en) <= toMin(s)) { msg.textContent = 'ساعت پایان باید بعد از شروع باشد.'; return; }
  state.personal.push({ id: Date.now(), title, day: Number($('meDay').value), start: toMin(s), end: toMin(en) });
  save(); closeSheet(); render();
});
document.addEventListener('change', e => {
  const m = e.target.closest && e.target.closest('[data-meal]');
  if (m && m.value) {
    const name = m.dataset.meal, pos = Number(m.dataset.pos), next = state.meals[name].slice();
    next[pos] = m.value;
    if (toMin(next[1]) <= toMin(next[0])) { m.value = state.meals[name][pos]; return; }
    state.meals[name] = next; save(); return;
  }
  const p = e.target.closest && e.target.closest('[data-place]');
  if (p) {
    const id = p.dataset.place;
    state.places = p.checked ? state.places.concat(id).filter((v, i, a) => a.indexOf(v) === i) : state.places.filter(v => v !== id);
    note = p.checked ? 'برای دیدن این مکان، به‌روزرسانی را بزنید.' : '';
    save();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

applyTheme();
if (sysDark && sysDark.addEventListener) sysDark.addEventListener('change', () => { if (state.theme === 'system') { applyTheme(); render(); } });
render();
try { if (document.fonts && document.fonts.load) document.fonts.load('600 16px Vazirmatn').then(f => { addLog('فونت وزیرمتن: ' + (f && f.length ? 'بارگذاری شد' : 'بارگذاری نشد')); save(); }).catch(() => { addLog('فونت وزیرمتن: بارگذاری نشد'); save(); }); } catch (e) {}
try { if (NATIVE) addLog('نسخه اپ ' + Native.version()); } catch (e) {}
if (WEB) { if (Native.bridgeMode && Native.bridgeMode()) setTimeout(doSync, 60); }
else if (NATIVE && state.connected) doSync();

</script>
</body>
</html>
